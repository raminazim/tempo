<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tempo</title>
    <meta
      name="description"
      content="Paste your text, set your pace, and read one word at a time with Tempo."
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ffffff'/%3E%3Cpath d='M9 8h14v4h-5v13h-4V12H9z' fill='%23141414'/%3E%3C/svg%3E"
    />
    <style>
      /* Theme tokens: keep the interface strictly black, white, and gray. */
      :root {
        color-scheme: dark;
        --bg: #101010;
        --panel: #191919;
        --line: #333333;
        --text: #f2f2f2;
        --muted: #aaaaaa;
        --soft: #828282;
        --white: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
        font-size: 16px;
      }

      button,
      input,
      textarea {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      button:disabled {
        cursor: default;
        opacity: 0.35;
      }

      button:focus-visible,
      input:focus-visible,
      textarea:focus-visible {
        outline: 2px solid var(--white);
        outline-offset: 4px;
      }

      /* Header and logo */
      header {
        height: 88px;
        margin: 0 auto;
        max-width: 1280px;
        padding: 0 5.3%;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        width: 146px;
      }

      .brand img {
        display: block;
        width: 146px;
        height: auto;
        filter: invert(1);
        mix-blend-mode: screen;
      }

      .header-note {
        color: var(--muted);
        font-size: 13px;
      }

      .tour-launch {
        padding: 8px 12px;
        border: 1px solid var(--line);
        border-radius: 20px;
        background: transparent;
        color: var(--muted);
        font-size: 13px;
      }

      .tour-launch:hover {
        border-color: #777777;
        color: var(--white);
      }

      main {
        max-width: 1280px;
        margin: 0 auto;
        padding: 36px 5.3% 22px;
      }

      .intro {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 22px;
      }

      h1 {
        margin: 0;
        font-size: clamp(28px, 3vw, 38px);
        font-weight: 500;
        letter-spacing: -1.4px;
      }

      .intro p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
      }

      /* Text editor and focus reader */
      .workspace {
        display: grid;
        grid-template-columns: minmax(260px, 0.82fr) minmax(0, 1.38fr);
        gap: 18px;
      }

      .editor,
      .reader,
      .speed {
        overflow: hidden;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
      }

      .editor {
        display: flex;
        flex-direction: column;
        min-height: 480px;
      }

      .panel-head,
      .reader-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 20px 22px 16px;
      }

      .panel-head label {
        font-weight: 600;
      }

      .text-actions {
        display: flex;
        gap: 12px;
      }

      .text-button {
        padding: 4px 0;
        border: 0;
        background: transparent;
        color: var(--muted);
        font-size: 13px;
      }

      .text-button:hover {
        color: var(--white);
      }

      textarea {
        width: 100%;
        flex: 1;
        min-height: 280px;
        padding: 0 22px 18px;
        border: 0;
        background: transparent;
        color: #d6d6d6;
        font-size: 16px;
        line-height: 1.8;
        resize: none;
      }

      textarea::placeholder {
        color: var(--soft);
      }

      .editor-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 16px 22px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 13px;
      }

      .reader {
        display: flex;
        flex-direction: column;
        min-height: 480px;
      }

      .reader-top {
        color: var(--muted);
        font-size: 11px;
        letter-spacing: 1.4px;
      }

      .focus-toggle {
        margin-left: auto;
      }

      .status {
        padding: 6px 9px;
        border-radius: 5px;
        background: #292929;
        color: var(--white);
        font-size: 11px;
        letter-spacing: 0;
      }

      .stage {
        position: relative;
        flex: 1;
        min-height: 250px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 28px;
      }

      .stage::before,
      .stage::after {
        content: "";
        position: absolute;
        left: 50%;
        width: 1px;
        height: 22px;
        background: #696969;
      }

      .stage::before {
        top: 26px;
      }

      .stage::after {
        bottom: 26px;
      }

      .word {
        max-width: 100%;
        overflow-wrap: anywhere;
        color: var(--white);
        font-size: clamp(32px, 5vw, 68px);
        font-weight: 500;
        letter-spacing: -2px;
        line-height: 1.15;
        text-align: center;
      }

      .progress-area {
        padding: 0 24px 18px;
      }

      .progress-label {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 10px;
        color: var(--muted);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }

      .track {
        height: 3px;
        overflow: hidden;
        border-radius: 3px;
        background: #373737;
      }

      .fill {
        width: 0;
        height: 100%;
        background: var(--white);
      }

      .transport {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 17px 20px;
        border-top: 1px solid var(--line);
      }

      .icon-btn {
        width: 40px;
        height: 40px;
        display: grid;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 50%;
        background: transparent;
        color: var(--muted);
      }

      .icon-btn:hover {
        border-color: #777777;
        color: var(--text);
      }

      .play {
        min-width: 150px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 12px 20px;
        border: 0;
        border-radius: 24px;
        background: var(--white);
        color: #181818;
        font-weight: 600;
      }

      .play:hover {
        background: #dddddd;
      }

      svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.7;
      }

      .options {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 16px;
        padding: 0 18px 18px;
        color: var(--muted);
        font-size: 13px;
      }

      .options label {
        display: flex;
        align-items: center;
        gap: 7px;
        cursor: pointer;
      }

      .options input {
        width: 15px;
        height: 15px;
        accent-color: var(--white);
      }

      .voice-note {
        color: var(--soft);
        font-size: 11px;
      }

      /* Speed control */
      .speed {
        display: grid;
        grid-template-columns: 154px minmax(0, 1fr);
        align-items: center;
        gap: 24px;
        margin-top: 18px;
        padding: 20px 24px;
      }

      .speed-title label {
        color: var(--muted);
        font-size: 13px;
      }

      .speed-value {
        display: flex;
        align-items: baseline;
        gap: 6px;
        margin-top: 5px;
      }

      .speed-value input {
        width: 72px;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--text);
        font-size: 28px;
        letter-spacing: -1px;
        appearance: textfield;
      }

      .speed-value input::-webkit-inner-spin-button {
        appearance: none;
      }

      .speed-value span {
        color: var(--muted);
        font-size: 11px;
        letter-spacing: 1px;
      }

      .slider-wrap {
        min-width: 0;
      }

      input[type="range"] {
        width: 100%;
        height: 20px;
        accent-color: var(--white);
        cursor: pointer;
      }

      .range-labels {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-top: 6px;
        color: var(--muted);
        font-size: 11px;
      }

      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 22px 2px 0;
        color: #898989;
        font-size: 12px;
        line-height: 1.7;
      }

      kbd {
        margin-right: 4px;
        padding: 3px 6px;
        border: 1px solid var(--line);
        border-radius: 4px;
        font: inherit;
      }

      footer a {
        color: var(--text);
        text-decoration: none;
      }

      footer a:hover {
        color: var(--white);
      }

      .tour-backdrop {
        position: fixed;
        z-index: 100;
        inset: 0;
        background: rgb(0 0 0 / 68%);
      }

      .tour-highlight {
        position: relative;
        z-index: 101;
        outline: 3px solid var(--white);
        outline-offset: 5px;
      }

      .tour-card {
        position: fixed;
        z-index: 102;
        right: max(24px, env(safe-area-inset-right));
        bottom: max(24px, env(safe-area-inset-bottom));
        width: min(390px, calc(100vw - 32px));
        padding: 24px;
        border: 1px solid #555555;
        border-radius: 14px;
        background: #191919;
        box-shadow: 0 16px 60px rgb(0 0 0 / 45%);
      }

      .tour-card[hidden],
      .tour-backdrop[hidden] {
        display: none;
      }

      .tour-step {
        margin: 0 0 12px;
        color: var(--muted);
        font-size: 11px;
        letter-spacing: 1.2px;
        text-transform: uppercase;
      }

      .tour-card h2 {
        margin: 0;
        font-size: 22px;
        font-weight: 500;
        letter-spacing: -0.5px;
        line-height: 1.25;
      }

      .tour-card p:not(.tour-step) {
        margin: 12px 0 22px;
        color: #c5c5c5;
        font-size: 14px;
        line-height: 1.6;
      }

      .tour-actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .tour-actions-side {
        display: flex;
        gap: 8px;
      }

      .tour-button {
        min-height: 38px;
        padding: 8px 14px;
        border: 1px solid var(--line);
        border-radius: 20px;
        background: transparent;
        color: var(--text);
        font-size: 13px;
      }

      .tour-button:hover {
        border-color: #777777;
      }

      .tour-button-primary {
        border-color: var(--white);
        background: var(--white);
        color: #181818;
        font-weight: 600;
      }

      .tour-button-primary:hover {
        border-color: #dddddd;
        background: #dddddd;
      }

      body.focus-mode {
        overflow: hidden;
      }

      .focus-mode header,
      .focus-mode .editor,
      .focus-mode .speed,
      .focus-mode footer {
        opacity: 0;
        pointer-events: none;
        transform: translateY(12px);
      }

      .focus-mode .reader {
        position: fixed;
        z-index: 10;
        inset: 0;
        display: block;
        min-height: 0;
        overflow: visible;
        border: 0;
        border-radius: 0;
        background: transparent;
        pointer-events: none;
      }

      .focus-mode .reader-top {
        position: fixed;
        z-index: 1;
        top: 24px;
        right: 5.3%;
        padding: 0;
        pointer-events: none;
      }

      .focus-mode .focus-toggle {
        pointer-events: auto;
      }

      .focus-mode .status,
      .focus-mode .progress-area,
      .focus-mode .transport,
      .focus-mode .options {
        opacity: 0;
        pointer-events: none;
        transform: translateY(12px);
      }

      .focus-mode .stage {
        position: absolute;
        inset: 0;
        min-height: 0;
        padding: 10vh 10vw;
      }

      .focus-mode .stage::before,
      .focus-mode .stage::after {
        opacity: 0;
      }

      .focus-controls {
        display: none;
      }

      .focus-mode .focus-controls {
        position: fixed;
        z-index: 11;
        right: 0;
        bottom: max(24px, env(safe-area-inset-bottom));
        left: 0;
        display: flex;
        justify-content: center;
        opacity: 1;
        pointer-events: none;
      }

      .focus-play {
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        border: 1px solid #555555;
        border-radius: 50%;
        background: #222222;
        color: var(--white);
        pointer-events: auto;
      }

      .focus-play:hover:not(:disabled) {
        background: #333333;
      }

      .focus-mode .word {
        font-size: clamp(40px, 8vw, 96px);
      }

      @media (prefers-reduced-motion: no-preference) {
        header,
        .editor,
        .reader,
        .reader-top,
        .status,
        .progress-area,
        .transport,
        .options,
        .focus-controls,
        .speed,
        footer,
        .stage::before,
        .stage::after {
          transition:
            opacity 0.35s ease,
            transform 0.35s ease,
            background 0.35s ease,
            border-color 0.35s ease;
        }
      }

      @media (max-width: 860px) {
        header {
          height: 78px;
        }

        .workspace {
          grid-template-columns: 1fr;
        }

        .editor,
        .reader {
          min-height: 390px;
        }

        textarea {
          min-height: 190px;
        }

        .stage {
          min-height: 230px;
        }
      }

      @media (max-width: 560px) {
        .brand,
        .brand img {
          width: 122px;
        }

        .header-note {
          display: none;
        }

        .tour-card {
          right: 16px;
          bottom: max(16px, env(safe-area-inset-bottom));
          padding: 20px;
        }

        main {
          padding-top: 26px;
        }

        .intro {
          display: block;
          margin-bottom: 18px;
        }

        .intro p {
          margin-top: 8px;
        }

        .speed {
          grid-template-columns: 1fr;
          gap: 14px;
        }

        footer {
          display: block;
        }

        footer > span:last-child {
          display: block;
          margin-top: 8px;
        }
      }

      @media (prefers-reduced-motion: no-preference) {
        button {
          transition: background 0.15s, border-color 0.15s, color 0.15s;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="brand" href="./" aria-label="Tempo home">
        <img src="tempo-logo.png" alt="Tempo" />
      </a>
      <button class="tour-launch" id="tour-launch" type="button">Take a tour</button>
    </header>

    <div class="tour-backdrop" id="tour-backdrop" hidden></div>
    <section
      class="tour-card"
      id="tour-card"
      role="dialog"
      aria-modal="true"
      aria-labelledby="tour-title"
      aria-describedby="tour-description"
      hidden
    >
      <p class="tour-step" id="tour-step"></p>
      <h2 id="tour-title" tabindex="-1"></h2>
      <p id="tour-description"></p>
      <div class="tour-actions">
        <button class="tour-button" id="tour-skip" type="button">Skip tour</button>
        <div class="tour-actions-side">
          <button class="tour-button" id="tour-back" type="button">Back</button>
          <button class="tour-button tour-button-primary" id="tour-next" type="button">
            Next
          </button>
        </div>
      </div>
    </section>

    <main>

      <div class="workspace">
        <section class="editor" aria-label="Text editor">
          <div class="panel-head">
            <label for="text">Your text</label>
            <div class="text-actions">
              <button class="text-button" id="edit" type="button">Edit</button>
              <button class="text-button" id="clear" type="button">Clear</button>
            </div>
          </div>
          <textarea
            id="text"
            placeholder="Paste anything you want to read here…"
            spellcheck="false"
          ></textarea>
          <div class="editor-foot">
            <span id="count">0 words</span>
          </div>
        </section>

        <section class="reader" aria-label="Word reader">
          <div class="reader-top">
            <span class="status" id="status">Ready when you are</span>
            <button
              class="text-button focus-toggle"
              id="focus-toggle"
              type="button"
              aria-label="Enter focus view"
              aria-pressed="false"
            >
              Focus
            </button>
          </div>

          <div class="stage">
            <div class="word" id="word">Ready.</div>
          </div>

          <div class="progress-area">
            <div class="progress-label">
              <span id="position">0 / 0 words</span>
              <span id="remaining">0 sec remaining</span>
            </div>
            <div
              class="track"
              role="progressbar"
              aria-label="Reading progress"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="0"
            >
              <div class="fill" id="fill"></div>
            </div>
          </div>

          <div class="transport" aria-label="Playback controls">
            <button
              class="icon-btn"
              id="restart"
              type="button"
              aria-label="Restart reading"
              title="Restart"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 10a9 9 0 1 1 2 8M3 4v6h6" />
              </svg>
            </button>
            <button class="play" id="play" type="button" disabled>
              <svg viewBox="0 0 24 24" id="play-icon" aria-hidden="true">
                <path d="m8 5 11 7-11 7Z" fill="currentColor" stroke="none" />
              </svg>
              <span id="play-label">Start reading</span>
            </button>
            <button
              class="icon-btn"
              id="stop"
              type="button"
              aria-label="Stop reading"
              title="Stop"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect
                  x="6"
                  y="6"
                  width="12"
                  height="12"
                  rx="1"
                  fill="currentColor"
                  stroke="none"
                />
              </svg>
            </button>
            <button
              class="icon-btn"
              id="back"
              type="button"
              aria-label="Go back ten words"
              title="Back 10 words"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m11 6-7 6 7 6m9-12-7 6 7 6" />
              </svg>
            </button>
          </div>

          <div class="options">
            <label><input type="checkbox" id="loop" /> Loop text</label>
            <label><input type="checkbox" id="voice" /> under rework</label>
            <span class="voice-note" id="voice-note">under rework</span>
          </div>

          <div class="focus-controls">
            <button
              class="focus-play"
              id="focus-play"
              type="button"
              aria-label="Start reading"
              title="Start reading"
              disabled
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m8 5 11 7-11 7Z" fill="currentColor" stroke="none" />
              </svg>
            </button>
          </div>
        </section>
      </div>

      <section class="speed" aria-label="Reading speed">
        <div class="speed-title">
          <label for="wpm">Reading speed</label>
          <div class="speed-value">
            <input
              type="number"
              id="wpm"
              min="50"
              max="1200"
              value="300"
              step="10"
              inputmode="numeric"
              aria-label="Words per minute"
            />
            <span>WPM</span>
          </div>
        </div>
        <div class="slider-wrap">
          <input
            type="range"
            id="speed"
            min="50"
            max="1200"
            step="10"
            value="300"
            aria-label="Reading speed slider"
          />
          <div class="range-labels">
            <span>50</span>
            <span>1,200</span>
          </div>
        </div>
      </section>

      <footer>
        <span><kbd>Space</kbd> play / pause <span style="margin-left: 12px"><kbd>←</kbd> back 10 words</span></span>
        <span
          >Made by
          <a href="https://github.com/raminazim" target="_blank" rel="noopener noreferrer"
            >Ramin Azim</a
          ></span
        >
      </footer>
    </main>

    <script src="app.js"></script>
  </body>
</html>
